name: Refresh HF model data

on:
  schedule:
    # Daily at 09:00 UTC — offset from releases (06:00) and legislation
    # (07:00); research runs at :17 every 6h and security at :37 every 3h,
    # scan-deps is weekly Monday 08:00.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Downloads pages to pull (1000 entries each)'
        required: false
        default: '3'
      dry_run:
        description: 'Dry run (fetch and count, no DB writes)'
        required: false
        default: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    # One endpoint call (4 hub requests happen server-side); 3 attempts x a
    # 200s curl cap plus backoff sleeps fits well under this cap.
    timeout-minutes: 20
    steps:
      - name: Hit refresh endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Own endpoint, hardcoded by default (overridable via
          # MODELS_REFRESH_URL). NEVER wire the generic shared REFRESH_URL
          # secret here: it holds the refresh-releases endpoint URL, so
          # reusing it silently hit refresh-releases daily instead of
          # refresh-models.
          MODELS_REFRESH_URL: ${{ secrets.MODELS_REFRESH_URL || 'https://freshcrateai-production.up.railway.app/api/cron/refresh-models' }}
          PAGES: ${{ github.event.inputs.pages || '3' }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set in repo settings"
            exit 1
          fi
          # The refresh runs SERVER-SIDE against the Railway prod DB: the app
          # endpoint calls refreshModels(getDb(), ...) exactly like
          # /api/cron/refresh-releases. The runner never checks out the repo
          # or touches a local SQLite file. HF_TOKEN lives as a Railway
          # variable (softer Hub rate limits); the runner needs nothing but
          # CRON_SECRET. One call covers the whole catalog — no shards.
          # budget_ms returns a partial result before the app's 300s
          # maxDuration. Retry 000/5xx (Railway edge drops seen on 10-20).
          ATTEMPTS=3
          BUDGET_MS=150000
          failed=0
          status=000
          for attempt in $(seq 1 $ATTEMPTS); do
            rm -f /tmp/body
            status=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              --connect-timeout 15 --max-time 200 \
              "${MODELS_REFRESH_URL}?pages=${PAGES}&dry=${DRY}&budget_ms=${BUDGET_MS}" || true)
            echo "Attempt $attempt/$ATTEMPTS HTTP status: $status"
            cat /tmp/body 2>/dev/null || true
            echo
            case "$status" in 000|5??) ;; *) break ;; esac
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep 20
          done
          if [ "$status" != "200" ]; then
            echo "::error::refresh-models returned HTTP $status after $attempt attempt(s)"
            failed=1
          fi
          exit $failed
