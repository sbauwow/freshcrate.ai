name: Refresh release data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max projects to process'
        required: false
        default: '3200'
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Hit refresh endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REFRESH_URL: ${{ secrets.REFRESH_URL || 'https://freshcrateai-production.up.railway.app/api/cron/refresh-releases' }}
          LIMIT: ${{ github.event.inputs.limit || '3200' }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set in repo settings"
            exit 1
          fi
          if [ -z "${REFRESH_URL:-}" ]; then
            echo "::error::REFRESH_URL secret is not set in repo settings"
            exit 1
          fi
          # One call per id-partition so each stays far under the 300s maxDuration
          # (a single full-catalog call hit 206-269s and timed out on 10-11 and 10-17).
          # On 10-20 shards 1-3 hung 300s with 0 bytes and never reached the app (Railway
          # edge drop), so retry 000/5xx. Shards take ~50s; the 150s budget lets curl give
          # up on a dead connection at 200s instead of 300s. Re-running a shard is safe.
          SHARDS=4
          ATTEMPTS=3
          BUDGET_MS=150000
          failed=0
          for shard in $(seq 0 $((SHARDS - 1))); do
            echo "::group::Shard $shard/$SHARDS"
            for attempt in $(seq 1 $ATTEMPTS); do
              rm -f /tmp/body
              status=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $CRON_SECRET" \
                --connect-timeout 15 --max-time 200 \
                "${REFRESH_URL}?limit=${LIMIT}&dry=${DRY}&shard=${shard}&shards=${SHARDS}&budget_ms=${BUDGET_MS}" || true)
              echo "Attempt $attempt/$ATTEMPTS HTTP status: $status"
              cat /tmp/body 2>/dev/null || true
              echo
              case "$status" in 000|5??) ;; *) break ;; esac
              [ "$attempt" -lt "$ATTEMPTS" ] && sleep 20
            done
            echo "::endgroup::"
            if [ "$status" != "200" ]; then
              echo "::error::Shard $shard returned HTTP $status after $attempt attempt(s)"
              failed=1
            fi
          done
          exit $failed
