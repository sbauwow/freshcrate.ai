name: build-agent-edition-vm-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images/vm-qcow2-headless.pkr.hcl
      - images/cloud-init/vm-qcow2-headless/meta-data
      - images/cloud-init/vm-qcow2-headless/user-data
      - scripts/build-agent-edition-image.sh
      - scripts/package-agent-edition-image.sh
      - scripts/provision-agent-edition-image.sh
      - scripts/bootstrap-agent-edition.sh
      - scripts/bootstrap-salt-local.sh
      - salt/**
      - scripts/verify-agent-edition.sh
      - scripts/lib/bootstrap-common.sh
      - lib/workbench-install.ts
      - app/workbench/page.tsx
      - app/install/agent-edition/page.tsx
      - app/api/page.tsx
      - tests/workbench-install.test.ts
      - tests/vm-image-lane.test.ts
      - tests/workbench-image-artifact-api.test.ts

permissions:
  contents: write

jobs:
  build-vm-qcow2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run targeted tests
        run: npm test --silent -- tests/workbench-install.test.ts tests/workbench-image-artifacts-api.test.ts tests/workbench-image-artifact-api.test.ts tests/vm-image-lane.test.ts

      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Install qemu tooling
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils ovmf xorriso mmdebstrap debootstrap

      - name: Enable KVM when the runner exposes it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
            echo "PKR_VAR_accelerator=kvm" >> "$GITHUB_ENV"
            echo "KVM enabled"
          else
            echo "no /dev/kvm; building under TCG"
          fi

      - name: Build vm-qcow2-headless
        run: bash scripts/build-agent-edition-image.sh --image vm-qcow2-headless --bundle solo-builder-core --mode headless --channel stable

      - name: Upload VM serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packer-serial-log-x86_64
          path: output/packer-serial-*.log
          if-no-files-found: ignore

      - name: Inspect vm-qcow2-headless output
        run: find output/vm-qcow2-headless -maxdepth 3 -type f | sort

      - name: Package vm-qcow2-headless
        run: bash scripts/package-agent-edition-image.sh --image vm-qcow2-headless --bundle solo-builder-core --mode headless --channel stable

      - name: Archive vm-qcow2-headless for release delivery
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          artifact = Path('output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2')
          archive = artifact.with_suffix(artifact.suffix + '.zip')
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              zf.write(artifact, arcname=artifact.name)
          PY

      - name: Upload vm-qcow2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm-qcow2-headless
          path: |
            output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2
            output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2.zip
            output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2.sha256
            output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2.json

      - name: Publish rolling GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: agent-edition-vm-qcow2-latest
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2.zip \
            output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2.sha256 \
            output/vm-qcow2-headless/freshcrate-solo-builder-core-stable.qcow2.json \
            --title "freshcrate Agent Edition VM QCOW2 (latest)" \
            --notes "Rolling latest QCOW2 artifact for freshcrate Agent Edition stable vm-qcow2-headless. Release ships the zipped qcow2 plus checksum and metadata." \
            --latest
